services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - pgdb
    restart: unless-stopped

  pgdb:
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pgdata:
